[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ogrep"
version = "0.1.0"
description = "Local semantic grep with SQLite index + OpenAI embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "openai>=1.0.0",
  "tqdm>=4.0.0",
]

[project.optional-dependencies]
speed = ["numpy>=1.24.0"]
mcp = ["mcp>=1.0.0"]

[project.scripts]
ogrep = "ogrep.cli:main"
